name: Publish to npm

on:
  release:
    types: [published]

permissions:
  id-token: write  # Critical requirement for OIDC authentication
  contents: read   # Required to read repository code checkout

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Compile and Build Package
        run: npm run build --if-present

      - name: Run Quality Verification Tests
        run: npm test

      - name: Stage Package via Trusted Publishing
        run: npm stage publish
